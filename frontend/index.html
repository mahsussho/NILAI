<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#064e3b">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>Arsip Nilai</title><link rel="stylesheet" href="tailwind.css"></head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">
<header class="bg-gradient-to-r from-brand-900 via-brand-800 to-emerald-900 text-white shadow-lg sticky top-0 z-40 no-print">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-emerald-400 to-brand-600 flex items-center justify-center font-black text-xl shadow-md border border-white/20">🕌</div>
      <div>
        <div class="flex items-center gap-2"><h1 id="app-title" class="text-xl font-extrabold tracking-wide uppercase font-serif">ARSIP NILAI</h1>
          <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-emerald-500/30 text-emerald-200 border border-emerald-400/30">SD KELAS 1-6</span></div>
        <p class="text-xs text-emerald-200/90 font-medium">Sistem Administrasi Penilaian & Master Siswa</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2 sm:gap-3 text-xs sm:text-sm">
      <div class="flex items-center bg-black/25 backdrop-blur-sm rounded-lg px-3 py-1.5 border border-white/10">
        <label for="ta" class="text-emerald-300 font-medium mr-2 text-xs">T.A:</label>
        <select id="ta" class="bg-transparent text-white font-semibold focus:outline-none cursor-pointer"></select>
      </div>
    </div>
  </div>
  <div class="bg-emerald-950/70 border-t border-white/10 shadow-inner overflow-x-auto">
    <div id="tabs" class="max-w-7xl mx-auto px-4 sm:px-6 flex space-x-1.5 py-2 text-xs sm:text-sm font-semibold whitespace-nowrap"></div>
  </div>
</header>
<main id="main" class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6"></main>
<div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 no-print">
  <div id="modal-box" class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto"></div></div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-full shadow-lg opacity-0 transition pointer-events-none z-[60]"></div>
<script type="module" src="app.js"></script></body></html>
